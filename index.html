<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel De Actividades</title>
    <link rel="stylesheet" href="/css/index.css">
    <script src="/js/index.js" defer></script>
</head>

<body>
    <header>
        <h1>Mi Panel De Actividades</h1>
        <nav class="navegacion">
            <div class="links">
                <a href="#tareas" class="on">Tareas</a>
                <a href="#AgregarTarea ">Agregar tarea</a>
            </div>
        </nav>
    </header>
    <main>
        <section id="tareas">
            <h2>Tareas pendientes</h2>
            <ul class="lista-actividad">
                <li class="tarjeta-actividad">
                    <p class="actividad-titulo">Hacer comida</p>
                    <div class="actividad-acciones">
                        <span class="prioridad prioridad-media">MEDIA</span>
                        <button>Completar</button>
                    </div>
                </li>
                <li class="tarjeta-actividad">
                    <p class="actividad-titulo">Ir al gym</p>
                    <div class="actividad-acciones">
                        <span class="prioridad prioridad-alta">ALTA</span>
                        <button>Completar</button>
                    </div>
                </li>
                <li class="tarjeta-actividad">
                    <p class="actividad-titulo">Hablar con la jeva</p>
                    <div class="actividad-acciones">
                        <span class="prioridad prioridad-baja">BAJA</span>
                        <button>Completar</button>
                    </div>
                </li>
            </ul>
        </section>
        <section id="AgregarTarea">
            <h2>Agregar Tarea</h2>
            <form class="agregar-actividad">
                <label for="titulo">Titulo de tarea</label>
                <input class="campo" type="text" placeholder="Titulo de tarea" id="titulo" required maxlength="80">
                <label for="descripcion">Descripcion de la tarea</label>
                <textarea class="campo" placeholder="Describe la tarea" id="descripcion"></textarea>
                <label for="prioridad">Prioridad de la tarea</label>
                <select class="campo" name="prioridad" id="prioridad">
                    <option value="">Alta</option>
                    <option value="">Media</option>
                    <option value="">Baja</option>
                </select>
                <button>Agregar tarea</button>
            </form>
        </section>

    </main>
    <footer>
        <section class="pie-pagina">
            <p>Panel de actividades, hecho con HTML</p>
        </section>
    </footer>
</body>

</html>
