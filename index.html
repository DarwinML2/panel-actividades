<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel De Actividades</title>
    <link rel="stylesheet" href="/css/index.css">
    <script src="/js/index.js" defer></script>
</head>

<body>
    <header>
        <h1 id="cabecera">Mi Panel De Actividades</h1>
        <nav>
            <a href="#tareas">Tareas</a>
            <a href="#AgregarTarea">Agregar tarea</a>
        </nav>
    </header>
    <main>
        <section id="tareas">
            <h2 id="cabecera">Tareas</h2>
            <ul class="lista-actividad">
                <li class="tarjeta-actividad">
                    <span class="actividad-titulo">Hacer comida</span>
                    <div class="actividad-acciones">
                        <span for="prioridad">MEDIA</span>
                        <button>Completar</button>
                    </div>
                </li>
                <li class="tarjeta-actividad">
                    <span class="actividad-titulo">Ir al GYM</span>
                    <div class="actividad-acciones">
                        <span for="prioridad">MEDIA</span>
                        <button>Completar</button>
                    </div>
                </li>
                <li class="tarjeta-actividad">
                    <span class="actividad-titulo">Asistir a la Universidad</span>
                    <div class="actividad-acciones">
                        <span for="prioridad">MEDIA</span>
                        <button>Completar</button>
                    </div>
                </li>
                <li class="tarjeta-actividad">
                    <span class="actividad-titulo">Ir a trabajar</span>
                    <div class="actividad-acciones">
                        <span for="prioridad">MEDIA</span>
                        <button>Completar</button>
                    </div>
                </li>
                <li class="tarjeta-actividad">
                    <span class="actividad-titulo">Comprar Cafe</span>
                    <div class="actividad-acciones">
                        <span for="prioridad">MEDIA</span>
                        <button>Completar</button>
                    </div>
                </li>

            </ul>
        </section>
        <section id="AgregarTarea">
            <h2 id="cabecera">Agregar Tarea</h2>
            <form class="agregar-actividad">
                <label for="titulo">Titulo de tarea</label>
                <input type="text" placeholder="Titulo de tarea" id="titulo" required maxlength="80">
                <label for="descripcion">Descripcion de la tarea</label>
                <textarea placeholder="Describe la tarea" id="descripcion"></textarea>
                <label for="prioridad">Prioridad de la tarea</label>
                <select name="prioridad" id="prioridad">
                    <option value="">Alta</option>
                    <option value="">Media</option>
                    <option value="">Baja</option>
                </select>
                <button>Agregar tarea</button>
            </form>
        </section>

    </main>
    <footer>
        <section class="pie-pagina">
            <p>Panel de actividades, hecho con HTML</p>
        </section>
    </footer>
</body>

</html>
